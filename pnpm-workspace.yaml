packages:
  - 'services/*'
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

# pnpm blocks install scripts by default. These need theirs: esbuild and supabase
# fetch their binaries, and @ffprobe-installer marks its bundled ffprobe
# executable (without it the file lands 0644 and cannot be spawned).
onlyBuiltDependencies:
  - esbuild
  - supabase
  - '@ffprobe-installer/ffprobe'
  - '@ffprobe-installer/darwin-arm64'
  - '@ffprobe-installer/darwin-x64'
  - '@ffprobe-installer/linux-x64'
  - '@ffprobe-installer/linux-arm64'
