name: CI

# Both jobs run on every push to main and on every pull request. Deliberately
# not path-filtered: in this monorepo a contract change breaks the generated
# client, and a migration breaks the generated database types, so "only run the
# db job when supabase/ changed" would miss exactly the failures worth catching.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no Docker and no running services. Fails fast on the
  # breakage that happens most often.
  check:
    name: Typecheck, test, lint
    # Pinned rather than ubuntu-latest: that label migrates to Ubuntu 26 on
    # 2026-10-19, and an image change landing mid-milestone is a debugging
    # session nobody asked for. Revisit after M1 exits (S10).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm before setup-node: setup-node's pnpm cache needs pnpm on PATH to
      # locate the store. Version comes from the packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first, and not as a matter of taste: workspace packages resolve
      # through their exports map to dist/index.d.ts, so on a fresh checkout
      # typecheck cannot see @suite/* until they have been emitted. pnpm -r build
      # is topological, so each package's dependencies are built before it.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      # D-022 boundaries, then the check that the boundary check can actually
      # fail. A green result from lint:deps alone proves nothing (D-033).
      - name: Dependency boundaries
        run: pnpm lint:deps

      - name: Dependency boundaries can fail
        run: pnpm lint:deps:verify

      # The committed spec and client must match the zod schemas (D-026).
      - name: Generated contract artifacts are current
        run: pnpm gen:check

      # Platform limits are data, never TypeScript literals (rule 9, S04).
      - name: No hard-coded platform limits
        run: pnpm lint:limits

      - name: Limit check can fail
        run: pnpm lint:limits:verify

  # Everything that needs Postgres and Supabase auth.
  database:
    name: Migrations, pgTAP, integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Supabase CLI is a repo devDependency (D-031), so CI runs the same
      # version as a developer's machine. No setup-cli action on purpose.
      # storage-api is included from S05 on: the media upload suite exercises real
      # signed URLs, which a stub cannot prove anything about.
      - name: Start Supabase
        run: >
          pnpm exec supabase start
          -x studio,realtime,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta,postgrest

      # Proves the migrations apply from zero, not just that they applied once.
      - name: Apply migrations from zero
        run: pnpm exec supabase db reset

      - name: Database invariants (pgTAP)
        run: pnpm exec supabase test db

      - name: Build workspace
        run: pnpm -r build

      # Needs a live database, so it cannot live in the check job.
      - name: Generated database types are current
        run: pnpm gen:types:check

      # Load the constraint specs the integration suite validates against.
      - name: Seed platform constraints
        run: pnpm -F @suite/poster-service seed:constraints
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Integration tests
        run: pnpm -F @suite/poster-service test:integration

      - name: Supabase logs on failure
        if: failure()
        run: pnpm exec supabase status || true

  # Builds the deployment artifact and runs both entrypoints out of it.
  #
  # Added because it was not here: the Dockerfile silently stopped building when
  # the service gained `@suite/poster-contract` as a dependency and
  # `@suite/poster-client` / `@suite/webhook-sink` as devDependencies. Every other
  # gate stayed green for five sessions while the thing we would actually deploy
  # could not be built (D-103). A deployable artifact that nothing builds is not a
  # deployable artifact.
  image:
    name: Image builds and both entrypoints start
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Context is the repo root, not services/poster: a workspace service needs
      # the root manifests and its workspace dependencies.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/poster/Dockerfile
          tags: poster-service:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Both processes are checked, because they are the same image and different
      # commands (D-034): a build that only ever runs the default CMD would not
      # notice the worker entrypoint disappearing.
      - name: API entrypoint serves /healthz
        run: |
          docker run -d --name api -p 8080:8080 \
            -e DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -e APP_TOKEN_SECRET='ci-signing-secret-at-least-32-chars!!' \
            -e SUPABASE_URL='http://127.0.0.1:54321' \
            -e SUPABASE_SERVICE_ROLE_KEY='ci-service-role-key' \
            -e SUPABASE_JWKS_URL='http://127.0.0.1:54321/auth/v1/.well-known/jwks.json' \
            -e SUPABASE_JWT_ISSUER='http://127.0.0.1:54321/auth/v1' \
            poster-service:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; exit 0; fi
            sleep 1
          done
          echo "healthz never answered"; docker logs api; exit 1

      # No database is reachable here, so the worker is expected to start its
      # loops and then fail to poll. Starting is the thing under test: it proves
      # the entrypoint exists, the vault key is validated, and the config loads.
      - name: Worker entrypoint starts its loops
        run: |
          docker run -d --name worker \
            -e DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
            -e VAULT_MASTER_KEY="$(openssl rand -base64 32)" \
            poster-service:ci node dist/worker/index.js
          sleep 8
          docker logs worker
          docker logs worker 2>&1 | grep -q 'poster-worker starting' || {
            echo "worker did not start"; exit 1; }
          docker logs worker 2>&1 | grep -q 'webhook deliverer started' || {
            echo "webhook deliverer did not start"; exit 1; }

      # ffprobe comes from apk, not npm (D-062): /v1/media cannot read a video
      # without it, and it is easy to lose in a base-image change.
      - name: ffprobe is present
        run: docker run --rm poster-service:ci ffprobe -version

      - name: SIGTERM shuts the worker down cleanly
        run: |
          docker stop -t 60 worker
          test "$(docker inspect -f '{{.State.ExitCode}}' worker)" = "0" || {
            echo "worker did not exit cleanly"; docker logs worker; exit 1; }
          docker logs worker 2>&1 | grep -q 'shutdown complete' || {
            echo "no clean shutdown in the log"; exit 1; }
